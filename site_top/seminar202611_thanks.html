<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>お申込みありがとうございました｜東京セミナー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{--navy:#192142;--sky:#8fc3ef;--muted:#4a5a78;--line:#d3dae6;--soft:#eef3fa;
    --font:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--navy);font-family:var(--font);font-size:16px;line-height:1.8}
  .wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px}
  .hero{background:var(--navy);color:#fff;border-radius:12px;padding:28px 20px;text-align:center}
  .hero .en{color:var(--sky);font-weight:900;letter-spacing:.12em;font-size:13px;margin:0}
  h1{font-size:clamp(22px,6vw,30px);font-weight:900;line-height:1.4;margin:6px 0 0}
  .card{border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:20px}
  .card p{margin:0 0 10px}
  .card p:last-child{margin:0}
  .note{background:var(--soft);border-radius:8px;padding:12px 14px;font-size:14px;color:var(--muted)}
  .btn{display:block;text-align:center;margin-top:20px;padding:14px;border-radius:10px;background:var(--navy);color:#fff;font-weight:900;text-decoration:none}
  .line{display:block;text-align:center;margin-top:12px;padding:12px;border:0;border-radius:10px;background:#06c755;color:#fff;font-weight:700;text-decoration:none}
  .line.big{font-size:19px;font-weight:900;padding:16px;margin-top:16px;animation:pulse 2.2s ease-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(6,199,85,.5)}60%{box-shadow:0 0 0 12px rgba(6,199,85,0)}}
  @media (prefers-reduced-motion:reduce){.line.big{animation:none}}
  .tel{text-align:center;font-size:14px;color:var(--muted);margin-top:24px}
  .tel a{color:var(--navy);font-weight:900;font-size:20px;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <p class="en">THANK YOU</p>
    <h1>お申込み<br>ありがとうございました</h1>
  </div>
  <div class="card">
    <p><b>最後にもうひとつだけ、お願いがあります。</b></p>
    <p>下のボタンからLINEの友だち追加をして、<b>「東京セミナー申込みました」</b>と送ってください。</p>
    <p>日程・会場のご案内（ZOOMの方は参加用URL）は、LINEでお送りします。</p>
  </div>
  <a class="line big" href="https://lin.ee/Va9z4pn" target="_blank" rel="noopener">LINEで友だち追加する</a>
  <a class="btn" href="https://www.jibulabo.jp/seminar202611.html">セミナーのページへ戻る</a>
</div>
</body>
</html>
