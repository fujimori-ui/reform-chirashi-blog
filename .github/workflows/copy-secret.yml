name: copy-secret
# 一時的な作業用: FTP_PASSWORD を zeirishi-blog リポジトリのSecretsへコピーする。
# 実行後にこのファイルとGH_PATは削除する。
on:
  workflow_dispatch:
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: copy FTP_PASSWORD to zeirishi-blog
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: gh secret set FTP_PASSWORD --repo fujimori-ui/zeirishi-blog --body "$FTP_PASSWORD"
