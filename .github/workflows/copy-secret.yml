name: copy-secret
# 一時的な作業用: CLAUDE_CODE_OAUTH_TOKEN を zeirishi-blog リポジトリのSecretsへコピーする。
# 実行後にこのファイルとGH_PATは削除する。
on:
  workflow_dispatch:
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: copy token to zeirishi-blog
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          CCOT: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo fujimori-ui/zeirishi-blog --body "$CCOT"
